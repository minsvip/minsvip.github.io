<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="100%" height="100%">
  <defs>
    <linearGradient id="brandBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="brandGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(16, 16)">
    <rect width="88" height="88" rx="20" fill="url(#brandBg)"/>
    <rect x="1" y="1" width="86" height="86" rx="19" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    
    <!-- Monogram Ribbon Path -->
    <path d="M 22,60 L 22,30 C 22,27.5 24,25.5 26.5,25.5 L 30,25.5 C 32.5,25.5 34.5,27 35.5,29.5 L 44,46 L 38,58 L 30,42 L 30,60 C 30,62 28.5,63.5 26.5,63.5 L 25.5,63.5 C 23.5,63.5 22,62 22,60 Z" fill="#06B6D4"/>
    <path d="M 66,60 L 66,30 C 66,27.5 64,25.5 61.5,25.5 L 58,25.5 C 55.5,25.5 53.5,27 52.5,29.5 L 44,46 L 50,58 L 58,42 L 58,60 C 58,62 59.5,63.5 61.5,63.5 L 62.5,63.5 C 64.5,63.5 66,62 66,60 Z" fill="url(#brandGrad)"/>
    <polygon points="44,24 49,32 44,40 39,32" fill="#38BDF8"/>
  </g>

  <!-- Wordmark Text -->
  <g transform="translate(126, 0)">
    <!-- Brand Title -->
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="1.5" fill="url(#textGrad)">MIN WANG</text>
    <circle cx="198" cy="50" r="4.5" fill="#38BDF8"/>
    
    <!-- Subtitle / Tagline -->
    <text x="1" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="3.5" fill="#94A3B8">MINSVIP.GITHUB.IO</text>
  </g>
</svg>
