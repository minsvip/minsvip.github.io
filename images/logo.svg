<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="mGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="mGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="128" height="128" rx="28" fill="url(#logoBg)"/>
  <rect x="1.5" y="1.5" width="125" height="125" rx="26.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Subtle glow layer behind emblem -->
  <g opacity="0.3" filter="url(#glow)">
    <path d="M 30,88 L 30,44 C 30,40 33,37 37,37 L 43,37 C 47,37 49,39 51,43 L 64,66 L 77,43 C 79,39 81,37 85,37 L 91,37 C 95,37 98,40 98,44 L 98,88 C 98,91 95,93 92,93 L 88,93 C 85,93 83,91 83,88 L 83,56 L 70,78 C 68,81 65,82.5 64,82.5 C 63,82.5 60,81 58,78 L 45,56 L 45,88 C 45,91 43,93 40,93 L 36,93 C 33,93 30,91 30,88 Z" fill="url(#mGrad1)"/>
  </g>

  <!-- Monogram Ribbon Path -->
  <!-- Left Wing & Angle -->
  <path d="M 32,88 L 32,44 C 32,41 34.5,38.5 37.5,38.5 L 42.5,38.5 C 45.5,38.5 48,40.5 49.5,43.5 L 64,69 L 55,85 L 43,62 L 43,88 C 43,90.5 41,92.5 38.5,92.5 L 36.5,92.5 C 34,92.5 32,90.5 32,88 Z" fill="url(#mGrad2)"/>
  
  <!-- Right Wing & Core Apex -->
  <path d="M 96,88 L 96,44 C 96,41 93.5,38.5 90.5,38.5 L 85.5,38.5 C 82.5,38.5 80,40.5 78.5,43.5 L 64,69 L 73,85 L 85,62 L 85,88 C 85,90.5 87,92.5 89.5,92.5 L 91.5,92.5 C 94,92.5 96,90.5 96,88 Z" fill="url(#mGrad1)"/>

  <!-- Central Dynamic Apex Diamond -->
  <polygon points="64,36 71,48 64,60 57,48" fill="#38BDF8"/>
  <polygon points="64,36 71,48 64,48" fill="#E0F2FE" opacity="0.8"/>
  <polygon points="64,64 69,72 64,80 59,72" fill="#818CF8"/>
</svg>
